[project]
name = "unified-owl"
version = "1.0.0"
description = "Unified OWL Installer — merged 6-repo resilient access engine: proxy evasion + DNS tunneling + Chameleon AI + FBaaS Edge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks,http2]>=0.28.1",
    "aiohttp>=3.14.3",
    "aiofiles>=25.1.0",
    "circuitbreaker>=2.1.3",
    "beautifulsoup4>=4.12",
    "markdownify>=1.2.3",
    "prometheus-client>=0.26.0",
    "dnslib>=0.9.24",
    "openai>=3.3.1",
    "cryptography>=41.0.0",
    "click>=8.0.0",
    "PyYAML>=6.0.2",
    "aiohttp-socks>=0.10.1",
]

[project.optional-dependencies]
proxy = ["proxybroker2==2.0.0a4", "litproxy>=0.1.0"]
redis = ["redis>=5.0"]
curl-cffi = ["curl_cffi==0.10.0"]
ml = ["scikit-learn>=1.3.0", "numpy>=1.24.0", "xgboost>=2.0.0", "joblib>=1.3.0", "watchdog>=3.0.0"]
full = ["redis>=5.0", "curl_cffi==0.10.0", "proxybroker2==2.0.0a4", "scikit-learn>=1.3.0", "xgboost>=2.0.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-aiohttp>=1.1.0", "respx>=0.22.0"]

[project.scripts]
owl-server = "owl_server:main"
owl-dns-synergy = "owl_dns_synergy.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["owl_dns_synergy*", "owl_server*"]
